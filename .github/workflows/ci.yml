name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Lint & format (CSharpier, Prettier, TypeScript, ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/SpecOps.Web/package-lock.json

      - name: C# and project files (CSharpier)
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Client resources (Prettier)
        working-directory: src/SpecOps.Web
        run: |
          npm ci --no-audit --no-fund
          npm run format:check

      - name: TypeScript (type check)
        working-directory: src/SpecOps.Web
        run: npm run typecheck

      - name: TypeScript (ESLint)
        working-directory: src/SpecOps.Web
        run: npm run lint

  build-and-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # SpecOps is cross-platform: every change is built and tested on Linux and Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/SpecOps.Web/package-lock.json

      - name: Restore
        run: dotnet restore SpecOps.slnx

      # Analyzer, code-style and NuGet audit warnings are errors (Directory.Build.props), so this fails on any warning.
      - name: Build
        run: dotnet build SpecOps.slnx --no-restore --configuration Release

      # Chromium for the Playwright browser tests (tests/SpecOps.E2E), plus its system libraries on Linux.
      - name: Install browser for E2E tests
        shell: pwsh
        run: tests/SpecOps.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Test (with coverage)
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution SpecOps.slnx --no-build --configuration Release \
            --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml 2>&1 | tee test-output.log

      # Each failed test (name, message and the start of its stack trace) as an annotation on the run summary, so
      # failures can be read without opening (or signing in to see) the full log.
      - name: Report failed tests
        if: failure()
        shell: bash
        run: |
          # (Without the colour codes the test runner adds.)
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r$//' test-output.log |
            awk '/^failed [A-Za-z]/ { if (m) print m; m = $0; n = 0; next }
                 m && n < 60 { m = m "%0A" $0; n++ }
                 END { if (m) print m }' |
            while IFS= read -r failure; do echo "::error title=Test failed::$failure"; done
          # No individual test failed (e.g. a test app couldn't start): show the end of the log instead.
          if ! grep -q "^failed [A-Za-z]" test-output.log; then
            echo "::error title=Tests didn't run::$(tail -n 25 test-output.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r$//' | awk '{ printf "%s%%0A", $0 }')"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/coverage.cobertura.xml
          if-no-files-found: warn

  dependency-review:
    name: Dependency review
    # Blocks pull requests that add dependencies with known vulnerabilities.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
