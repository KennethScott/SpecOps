# HTTPS in front of SpecOps with Caddy (certificates, renewals, HTTP->HTTPS redirect).
#
#   SPECOPS_HOST=specops.example.com docker compose -f compose.yaml -f compose.caddy.yaml up -d
#
# SPECOPS_TLS chooses the certificate (see deploy/Caddyfile and docs/docker.md):
#   auto (default)  Let's Encrypt: public DNS name and ports 80/443 reachable from the internet
#   internal        Caddy's own CA: internal networks and testing (install its root certificate on clients)
#   files           your certificate (e.g. internal CA) as certs/specops.crt + certs/specops.key next to this file

services:
  specops:
    # Only Caddy talks to SpecOps.
    ports: !reset []
    environment:
      # Trust X-Forwarded-* headers from Caddy (this network), so sign-in redirects, secure cookies and client IPs
      # in the audit log are correct.
      Proxy__KnownNetworks__0: 172.30.0.0/24
      AllowedHosts: ${SPECOPS_HOST:?Set SPECOPS_HOST to the DNS name for SpecOps}
    networks: [specops]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SPECOPS_HOST: ${SPECOPS_HOST}
      SPECOPS_TLS: ${SPECOPS_TLS:-auto}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Only used with SPECOPS_TLS=files.
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [specops]

networks:
  specops:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
